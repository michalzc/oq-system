      QueryPermission: Ask the GM to enable Query Users permission, then retry.
      Advanced: The encounter advanced. Review the tracker and retry.
      Frozen: Declarations are frozen for this round.
      NotOwner: You must own this actor to declare its action.
      ActionUnavailable: That action is no longer available. Select an action again.
      NotYourTurn: Only the GM or the current actor owner can advance this encounter.
      GMOnlyStart: Only a GM can start a round.
      FinishTurns: Finish the remaining turns before declaring the next round.
      AskGMStart: Ask the GM to start the round.
      Unknown: Unknown combat declaration request.
      AlreadyStarted: This round has already started.
      NoEligible: No eligible participants remain.
      InitiativeFrozen: Initiative is frozen for this round. Change the actor defaults for the next declaration.
