  Settings:
    defaultItemsCompendium:
      name: Default Items Compendium
      hint: >-
        Select the compendium that contains default items for newly created actors. Only items marked with
        "Default for New Actors" in the item sheet's menu are added.
    defaultItemsFromWorld:
      name: Default Items from World
      hint: >-
        Also add the world's items marked with "Default for New Actors" to newly created actors. A world item imported
        from the Default Items Compendium replaces the compendium original.
    coinsConfiguration:
      name: Coins Configuration
      hint: >-
        Input coins in the format <CoinName> (<CoinAbbr>) = <Multiplier>. Each coin is separated by a comma.
        <CoinName> is the full name of the coin, <CoinAbbr> is the coin's abbreviation, and <Multiplier> is
        the coin's value relative to the base coin. Ensure at least one coin has a multiplier of 1.
