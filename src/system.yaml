---
id: oq
title: OQ System
description: OpenQuest SRD System for FoundryVTT
authors:
  - name: Michał Z.
    email: parmezan@gmail.com
url: https://github.com/michalzc/oq-system
license: WTFPL – Do What the Fuck You Want to Public License
readme: README.md
version: 0.1.0-SNAPSHOT
compatibility:
  minimum: 14
  verified: 14
esmodules:
  - module/oq.js
styles:
  - styles/oq.css
documentTypes:
  # htmlFields paths are relative to `system`; the server sanitises these fields.
  Actor:
    character:
      htmlFields: [personal.notes]
    npc:
      htmlFields: [personal.description, personal.shortDescription]
  Item:
    skill:
      htmlFields: [description]
    weapon:
      htmlFields: [description]
    armour:
      htmlFields: [description]
    equipment:
      htmlFields: [description]
    spell:
      htmlFields: [description]
    specialAbility:
      htmlFields: [description]
packs:
  - name: oq-system-basic-skills
    label: Skills
    path: packs/basic-skills
    type: Item
    system: oq
    ownership:
      PLAYER: OBSERVER
      ASSISTANT: OWNER

  - name: oq-system-documentation
    label: Documentation
    path: packs/documentation
    type: JournalEntry
    system: oq
    ownership:
      PLAYER: OBSERVER
      ASSISTANT: OWNER

  - name: oq-system-spells
    label: Spells
    path: packs/spells
    type: Item
    system: oq
    ownership:
      PLAYER: OBSERVER
      ASSISTANT: OWNER

  - name: oq-system-equipment
    label: Equipment
    path: packs/equipment
    type: Item
    system: oq
    ownership:
      PLAYER: OBSERVER
      ASSISTANT: OWNER

  - name: oq-system-bestiary-journal
    label: SRD Bestiary
    path: packs/bestiary
    type: JournalEntry
    system: oq
    ownership:
      PLAYER: OBSERVER
      ASSISTANT: OWNER

packFolders:
  - name: OpenQuest SRD
    sorting: a
    packs:
      - oq-system-basic-skills
      - oq-system-documentation
      - oq-system-spells
      - oq-system-equipment
      - oq-system-bestiary-journal
languages:
  - lang: en
    name: English
    path: lang/en.json
socket: false
initiative: "@attributes.initiative.value"
# Filled in by the release workflow, which only replaces keys that already exist. Kept as placeholders in development
# builds, so Foundry never offers to update a linked dev build from the latest release.
manifest: tbd
download: tbd
