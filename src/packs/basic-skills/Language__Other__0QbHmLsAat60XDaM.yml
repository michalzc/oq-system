  description: >-
    <p>The Language skill is several separate skills grouped under a single
    heading. Language (Gatanese), Language (Dark Lander) and Language
    (Goblinoid), for example, are all individual skills.</p><p>Every character
    with a Language skill of 50% or more is fluent in that language, although
    they are likely to have an accent if it is not their native
    language.</p><p>A score in a Language skill of 80% or more will mean the
    character can also read and write in that language.</p>
