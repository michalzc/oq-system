name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  package_type: system
  node_version: 24

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node_version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node_version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node_version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Replaces only top-level keys that already exist in the manifest and fails if one is missing.
      - name: Set release metadata in the manifest
        env:
          VERSION: ${{ github.event.release.tag_name }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          file=src/${{ env.package_type }}.yaml
          version=${VERSION#v}
          for key in version url manifest download; do
            grep -q "^$key:" "$file" || { echo "::error::$file has no top-level '$key'"; exit 1; }
          done
          sed -i -E \
            -e "s|^version:.*|version: $version|" \
            -e "s|^url:.*|url: $REPO_URL|" \
            -e "s|^manifest:.*|manifest: $REPO_URL/releases/latest/download/${{ env.package_type }}.json|" \
            -e "s|^download:.*|download: $REPO_URL/releases/download/$VERSION/${{ env.package_type }}.zip|" \
            "$file"
          grep -E '^(version|url|manifest|download):' "$file"

      - name: Build
        run: yarn build

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build

  publish:
    needs:
      - lint
      - test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download production artifacts for publication
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Create zip file
        working-directory: ./build
        run: zip -r ../${{ env.package_type }}.zip .

      # Attaches the artifacts to the published release; its name, notes and pre-release flag stay as they are.
      - name: Attach artifacts to the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './build/${{ env.package_type }}.json, ./${{ env.package_type }}.zip'
